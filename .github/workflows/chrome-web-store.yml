name: Chrome Web Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric Chrome manifest version (for example 1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Validate release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == "v$RELEASE_VERSION" ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "Release tag commit must be reachable from main" >&2
            exit 1
          }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci
      - name: Test release helpers
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m unittest scripts/test_publish_cws_release.py
          node --test scripts/package-cws-release.test.mjs scripts/bump-version.test.mjs
      - run: pnpm build
      - name: Package and verify Chrome extension
        run: node scripts/package-cws-release.mjs "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrome-web-store-${{ inputs.version }}
          path: .tmp/cws-release.zip
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chrome-web-store-${{ inputs.version }}
          path: release
      - name: Install Google auth library
        run: python -m pip install --disable-pip-version-check 'google-auth==2.40.3'
      - name: Upload and submit to Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/publish-cws-release.py release/cws-release.zip "$RELEASE_VERSION"
