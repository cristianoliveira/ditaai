<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speechify Side Panel</title>

    <link rel="stylesheet" href="../css/color-tokens-for-html-pages.css" />

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'system-ui', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: var(--color-background-secondary-bg-sec-0-110);
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;

        font-size: 16px;
        font-style: normal;
        font-weight: 400;
        line-height: 24px; /* 150% */
        letter-spacing: -0.08px;
      }

      body * {
        font-family: 'system-ui', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;

        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #speechify-sidepanel-root {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #666;
        font-family: 'system-ui', system-ui, sans-serif;
      }

      @keyframes waveSnake {
        0% {
          stroke-dashoffset: 1;
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        50% {
          stroke-dashoffset: 0;
        }
        92% {
          opacity: 1;
        }
        100% {
          stroke-dashoffset: -1;
          opacity: 0;
        }
      }

      .wave-animated {
        stroke-dasharray: 0.35 0.65;
        stroke-dashoffset: 1;
        animation: waveSnake 3s cubic-bezier(0.4, 0, 0.6, 0.6) infinite;
      }

      .smoothScrollbar::-webkit-scrollbar {
        width: 10px;
        background: transparent;
      }

      .smoothScrollbar::-webkit-scrollbar-track {
        display: none;
      }

      .smoothScrollbar::-webkit-scrollbar-thumb {
        border-radius: 100px;
        background-color: var(--color-icon-text-icn-txt-quat);
        border: 2px solid transparent;
        background-clip: padding-box;
        min-height: 100px;
      }

      .smoothScrollbar::-webkit-scrollbar-button {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="speechify-sidepanel-root">
      <div class="loading">
        <svg
          width="84"
          height="56"
          viewBox="0 0 60 40"
          fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M 5.83 26.3 C 10.251 28.391 11.613 19.006 13.072 10.251 C 14.126 3.923 18.26 3.904 19.248 10.251 C 19.748 13.467 20.227 16.661 20.742 20 C 21.257 23.339 21.735 26.533 22.235 29.749 C 23.223 36.096 27.357 36.077 28.411 29.749 C 28.983 26.316 29.545 22.975 30.049 20 C 30.553 17.025 31.115 13.684 31.687 10.251 C 32.741 3.923 36.875 3.904 37.863 10.251 C 38.363 13.467 38.842 16.661 39.357 20 C 39.872 23.339 40.35 26.533 40.85 29.749 C 41.838 36.096 45.972 36.077 47.026 29.749 C 48.485 20.994 49.216 13.509 54.17 14.188"
            stroke="var(--color-background-bg-blue)"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none" />
          <path
            class="wave-animated"
            d="M 5.83 26.3 C 10.251 28.391 11.613 19.006 13.072 10.251 C 14.126 3.923 18.26 3.904 19.248 10.251 C 19.748 13.467 20.227 16.661 20.742 20 C 21.257 23.339 21.735 26.533 22.235 29.749 C 23.223 36.096 27.357 36.077 28.411 29.749 C 28.983 26.316 29.545 22.975 30.049 20 C 30.553 17.025 31.115 13.684 31.687 10.251 C 32.741 3.923 36.875 3.904 37.863 10.251 C 38.363 13.467 38.842 16.661 39.357 20 C 39.872 23.339 40.35 26.533 40.85 29.749 C 41.838 36.096 45.972 36.077 47.026 29.749 C 48.485 20.994 49.216 13.509 54.17 14.188"
            stroke="var(--color-icon-text-icn-txt-prim-electric)"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
            pathLength="1" />
        </svg>
      </div>
    </div>
    <script src="../piper-local-voice.js"></script>
    <script src="main.js" type="module"></script>
  </body>
</html>
