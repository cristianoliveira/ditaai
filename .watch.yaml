## Funzzy events file
# more details see: https://github.com/cristianoliveira/funzzy
#
# List here the tasks and the commands for this workflow
# then run `fzz` to start to work.
#
on:
  socket: .pi/fzz.sock
  change: '**/*.ts'
  ignore:
    - '**/*.js'
    - '**/*.config.ts'

tasks:
  - name: Update plans
    run:
      - git add plans/
      - git commit -m "chore: updated plans"
    change: 'plans/**/*'
    run_on_init: true

  - name: CI checks
    run:
      - just check
      - just bump
      - just build
    run_on_init: true

  - name: smoke test
    run:
      - sleep 30
      - just observe-stop
      - just observe-start
    run_on_init: true
