## Funzzy events file
# more details see: https://github.com/cristianoliveira/funzzy
#
# List here the tasks and the commands for this workflow
# then run `fzz` to start to work.
#
control:
  socket: .pi/fzz.sock

tasks:
  - name: CI checks
    run:
      - just check
      - just bump
      - just build
    change: '**/*.ts'
    ignore:
      - '**/*.js'
      - '**/*.config.ts'
    run_on_init: true

  - name: smoke test
    run:
      - sleep 30
      - just observe-stop
      - just observe-start
    change: '**/*.ts'
    ignore:
      - '**/*.js'
      - '**/*.config.ts'
    run_on_init: true
