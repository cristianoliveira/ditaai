## Funzzy events file
# more details see: https://github.com/cristianoliveira/funzzy
#
# List here the tasks and the commands for this workflow
# then run `fzz` to start to work.
#
on:
  socket: .pi/fzz.sock
  change: '**/*.ts'
  concurrency: 2
  ignore:
    - '**/*.js'
    - '**/*.config.ts'

tasks:
  - name: Update plans
    run:
      - git add plans/
      # Commit only when plans/ actually has staged changes. Without this,
      # run_on_init fails with "nothing to commit" when plans/ is unchanged,
      # and the pre-commit version bump otherwise sneaks in empty commits.
      - 'git diff --cached --quiet -- plans/ || git commit -m "chore: updated plans"'
    change: 'plans/**/*'
    run_on_init: true

  # Version bump mutates files that check/build read, so it stays serial
  # before the parallel ci group.
  - name: Bump version
    run:
      - just bump
    run_on_init: true

  - name: CI checks
    parallel: ci
    run:
      - just check
    run_on_init: true

  - name: Build
    parallel: ci
    run:
      - just build
    run_on_init: true

  # Runs only after the ci group reaches a terminal outcome, so the browser
  # restart picks up the fresh build.
  - name: smoke test
    run:
      - sleep 30
      - just observe-stop
      - just observe-start
    run_on_init: true
