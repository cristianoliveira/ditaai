<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DitaAi — PDF reader</title>
</head>
<body>
  <main id="pdf-reader" data-pdf-state="loading">
    <header>
      <h1>PDF reader</h1>
      <p id="pdf-status" role="status">Preparing this document…</p>
      <output id="pdf-page-position" aria-live="polite"></output>
    </header>
    <section id="pdf-controls" aria-label="Playback controls">
      <button type="button" data-action="play">Play</button>
      <button type="button" data-action="pause">Pause</button>
      <button type="button" data-action="stop">Stop</button>
    </section>
    <section id="pdf-pages" aria-label="Document text"></section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
