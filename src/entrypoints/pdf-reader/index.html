<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DitaAi — PDF reader</title>
  <style>
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }
    #pdf-pages section {
      position: relative;
      margin: 1.5rem auto;
      width: fit-content;
    }
    .pdf-page-render {
      position: relative;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
      background: white;
    }
    .pdf-page-canvas {
      display: block;
    }
    .textLayer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 1;
      line-height: 1;
      text-size-adjust: none;
      forced-color-adjust: none;
      transform-origin: 0 0;
      caret-color: CanvasText;
    }
    .textLayer span {
      position: absolute;
      color: transparent;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    .textLayer mark.dita-word-highlight {
      position: absolute;
      margin: 0;
      padding: 0;
      border-radius: 2px;
      background: var(--dita-accent, #f5b840);
      mix-blend-mode: multiply;
      pointer-events: none;
    }
    .pdf-page-text {
      max-width: 70ch;
      margin: 1rem auto;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main id="pdf-reader" data-pdf-state="loading">
    <header>
      <h1>PDF reader</h1>
      <p id="pdf-status" role="status">Preparing this document…</p>
      <output id="pdf-page-position" aria-live="polite"></output>
    </header>
    <section id="pdf-controls" aria-label="Playback controls">
      <button type="button" data-action="play">Play</button>
      <button type="button" data-action="pause">Pause</button>
      <button type="button" data-action="stop">Stop</button>
      <button type="button" data-action="previous" aria-label="Previous page">Previous page</button>
      <button type="button" data-action="next" aria-label="Next page">Next page</button>
      <label for="pdf-rate">Speed</label>
      <input id="pdf-rate" data-role="rate" type="range" min="0.5" max="2" step="0.1" value="1" />
    </section>
    <section id="pdf-pages" aria-label="Document text"></section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
