<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DitaAi — Narration voices</title>
</head>
<body>
  <main id="app">
    <header>
      <h1>🎙️ Narration voices</h1>
      <p>Choose a local voice for your page audio. Page text stays on this device.</p>
    </header>

    <section id="status-bar"></section>

    <section id="engine-section">
      <h2>Engine Assets</h2>
      <div id="engine-status">Checking…</div>
    </section>

    <section id="voices-section">
      <h2>Voices</h2>
      <div id="voices-grid"></div>
    </section>

    <section id="shortcuts-section">
      <h2>Keyboard shortcuts</h2>
      <p>Control narration from anywhere on the page. Click Change, then press the new keys.</p>
      <div id="shortcuts-list"></div>
    </section>
  </main>

  <style>
    /* Accent — single declaration for this page. Keep in sync with
       src/content/theme.ts (theme.accent / theme.accentHover). */
    :root {
      --dita-accent: #f59e0b;
      --dita-accent-hover: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #0f0f1a;
      color: #e0e0f0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    header p {
      color: #8b8ba7;
      font-size: 14px;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--dita-accent);
      margin-bottom: 12px;
    }
    section {
      margin-bottom: 32px;
    }

    .status-bar {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .status-bar.ok { background: #1a3a2a; color: #6fcf97; }
    .status-bar.warn { background: #3a3520; color: #f2c94c; }

    #engine-status {
      padding: 12px 16px;
      border-radius: 8px;
      background: #1a1a2e;
      font-size: 13px;
      color: #8b8ba7;
    }
    #engine-status.ready { color: #6fcf97; }

    #voices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .voice-card {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: box-shadow 0.15s;
    }
    .voice-card:hover {
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.15);
    }
    .voice-card.selected {
      outline: 2px solid var(--dita-accent);
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.2);
    }
    .voice-card .name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }
    .voice-card .meta {
      font-size: 12px;
      color: #8b8ba7;
    }
    .voice-card .size {
      font-size: 11px;
      color: #5a5a7a;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-download {
      background: var(--dita-accent);
      color: #fff;
    }
    .btn-download:hover:not(:disabled) { background: var(--dita-accent-hover); }
    .btn-download.loading { background: #6b4d12; }

    .btn-selected {
      background: #1a3a2a;
      color: #6fcf97;
      cursor: default;
    }
    .btn-select-voice {
      background: #2a2a4a;
      color: var(--dita-accent-hover);
      border: 1px solid #4a4a6a;
    }
    .btn-select-voice:hover { background: #3a3a5a; }

    .btn-download-all {
      background: var(--dita-accent);
      color: #fff;
      width: 100%;
      padding: 12px;
      font-size: 14px;
      margin-top: 8px;
    }
    .btn-download-all:hover:not(:disabled) { background: var(--dita-accent-hover); }

    .progress-bar {
      height: 4px;
      background: #2a2a4a;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-bar .fill {
      height: 100%;
      background: var(--dita-accent);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .shortcuts-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: #1a1a2e;
      border-radius: 8px;
    }
    .shortcut-row.recording { outline: 1px solid var(--dita-accent); }
    .shortcut-action-label { font-size: 13px; color: #e0e0f0; }
    .shortcut-combo {
      font-size: 12px;
      color: var(--dita-accent-hover);
      background: #2a2a4a;
      padding: 4px 10px;
      border-radius: 6px;
      min-width: 140px;
      text-align: center;
    }
    .shortcut-change {
      background: #2a2a4a;
      color: #fff;
      border: 1px solid #4a4a6a;
      padding: 4px 12px;
      font-size: 12px;
    }
    .shortcut-change:hover { background: #3a3a5a; }
    .shortcut-error {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #3a2018;
      color: #f2994a;
      font-size: 12px;
    }
    .shortcut-reset {
      margin-top: 12px;
      background: transparent;
      color: #8b8ba7;
      border: 1px solid #4a4a6a;
    }
    .shortcut-reset:hover { color: #fff; }
  </style>

  <script type="module" src="./main.ts"></script>
</body>
</html>
